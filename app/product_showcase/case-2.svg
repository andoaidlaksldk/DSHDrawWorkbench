<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="DSH 画板：思维导图">
  <title>DSH 画板 · 思维导图</title>
  <!--
    DSH 画板工作台 · 产品展示图（思维导图）。
    矢量源文件在本包 overlay/brand/product_showcase/ 下，位图由 scripts/render-brand.mjs 渲染。
    版式约束：画布可视区是 x 88..932，导图最右侧节点收在 896，不会被右侧面板遮住。
  -->
  <defs>
    <linearGradient id="c2Mark" x1="0" y1="0" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B7DFF"/>
      <stop offset="1" stop-color="#12B5A5"/>
    </linearGradient>
    <pattern id="c2Grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#D9DDE4"/>
    </pattern>
    <filter id="c2Shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#111827" flood-opacity=".14"/>
    </filter>
    <filter id="c2Note" x="-10%" y="-10%" width="120%" height="128%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#111827" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="#EEF1F6"/>
  <g filter="url(#c2Shadow)">
    <rect x="20" y="20" width="1160" height="710" rx="14" fill="#FFFFFF"/>
  </g>

  <!-- 顶栏 -->
  <rect x="20" y="20" width="1160" height="52" rx="14" fill="#FFFFFF"/>
  <rect x="20" y="58" width="1160" height="14" fill="#FFFFFF"/>
  <line x1="20" y1="71.5" x2="1180" y2="71.5" stroke="#E5E6EB"/>
  <rect x="44" y="33" width="26" height="26" rx="8" fill="url(#c2Mark)"/>
  <rect x="50.5" y="39.5" width="13" height="13" rx="3.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity=".95"/>
  <path d="M53.8 48.4 57 45.2" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <text x="80" y="51" font-size="15.5" font-weight="700" fill="#1F2329" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">DSH 画板</text>
  <text x="151" y="51" font-size="12.5" fill="#8A9099" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">产品规划</text>
  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#1F2329">
    <rect x="916" y="33" width="72" height="26" rx="13" fill="#FFFFFF" stroke="#E1E3E8"/>
    <text x="952" y="50" text-anchor="middle">导入</text>
    <rect x="996" y="33" width="88" height="26" rx="13" fill="#2E6BE6"/>
    <text x="1040" y="50" text-anchor="middle" fill="#FFFFFF">立即保存</text>
  </g>

  <!-- 左侧工具条：6 个等间距工具位（与 case-1 同一套栅格） -->
  <g>
    <rect x="20" y="72" width="68" height="658" fill="#FCFCFD"/>
    <line x1="87.5" y1="72" x2="87.5" y2="730" stroke="#E9EBEF"/>

    <rect x="34" y="120" width="40" height="40" rx="10" fill="#FFFFFF" stroke="#E9EBEF"/>
    <rect x="43" y="129" width="22" height="22" rx="5" fill="none" stroke="#8A9099" stroke-width="2"/>

    <rect x="34" y="184" width="40" height="40" rx="10" fill="#FFFFFF" stroke="#E9EBEF"/>
    <circle cx="54" cy="204" r="9" fill="none" stroke="#8A9099" stroke-width="2"/>

    <rect x="34" y="248" width="40" height="40" rx="10" fill="#FFFFFF" stroke="#E9EBEF"/>
    <path d="M44 276l14-14M58 262v6M58 262h-6" fill="none" stroke="#8A9099" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="34" y="312" width="40" height="40" rx="10" fill="#FFFFFF" stroke="#E9EBEF"/>
    <path d="M45 332h18M54 332v14" fill="none" stroke="#8A9099" stroke-width="2" stroke-linecap="round"/>

    <!-- 当前选中：导图工具 -->
    <rect x="34" y="376" width="40" height="40" rx="10" fill="#E8F0FF" stroke="#3B7DFF"/>
    <g fill="none" stroke="#2E6BE6" stroke-width="2" stroke-linecap="round">
      <circle cx="45" cy="396" r="3" fill="#2E6BE6"/>
      <path d="M49 396h6l6-7M55 396l6 7"/>
      <circle cx="67" cy="386" r="2.4" fill="#2E6BE6"/>
      <circle cx="67" cy="406" r="2.4" fill="#2E6BE6"/>
    </g>

    <rect x="34" y="440" width="40" height="40" rx="10" fill="#FFFFFF" stroke="#E9EBEF"/>
    <path d="M42 470c7-14 19-4 24-12" fill="none" stroke="#8A9099" stroke-width="2" stroke-linecap="round"/>

    <g fill="#8A9099" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" text-anchor="middle">
      <text x="54" y="172">矩形</text>
      <text x="54" y="236">椭圆</text>
      <text x="54" y="300">箭头</text>
      <text x="54" y="364">文字</text>
      <text x="54" y="428">导图</text>
      <text x="54" y="492">手绘</text>
    </g>
  </g>

  <!-- 画布 -->
  <rect x="88" y="72" width="844" height="658" fill="url(#c2Grid)"/>

  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
    <text x="130" y="112" font-size="19" font-weight="700" fill="#1F2329">产品规划</text>
    <text x="130" y="134" font-size="12.5" fill="#8A9099">导图分支可继续展开；Agent 也能直接写进来</text>

    <!-- 分支连线 -->
    <g stroke="#A9B0BC" stroke-width="2" fill="none">
      <path d="M450 380C490 380 495 262 520 262"/>
      <path d="M450 380C490 380 520 380 556 380"/>
      <path d="M450 380C490 380 495 538 520 538"/>
      <path d="M670 262C695 262 695 210 720 210"/>
      <path d="M670 262C695 262 695 286 720 286"/>
      <path d="M706 380C730 380 730 350 756 350"/>
      <path d="M706 380C730 380 730 430 756 430"/>
      <path d="M670 538C695 538 695 510 720 510"/>
      <path d="M670 538C695 538 695 586 720 586"/>
    </g>

    <!-- 根节点 -->
    <rect x="280" y="350" width="170" height="60" rx="14" fill="#2E6BE6"/>
    <text x="365" y="386" font-size="15.5" font-weight="600" text-anchor="middle" fill="#FFFFFF">产品规划</text>

    <!-- 一级分支 -->
    <rect x="520" y="240" width="150" height="44" rx="12" fill="#FFFFFF" stroke="#12B5A5" stroke-width="2"/>
    <text x="595" y="267" font-size="13.5" text-anchor="middle" fill="#0E7F74">用户价值</text>
    <rect x="556" y="358" width="150" height="44" rx="12" fill="#FFFFFF" stroke="#3B7DFF" stroke-width="2"/>
    <text x="631" y="385" font-size="13.5" text-anchor="middle" fill="#2354C7">技术方案</text>
    <rect x="520" y="516" width="150" height="44" rx="12" fill="#FFFFFF" stroke="#E8A33D" stroke-width="2"/>
    <text x="595" y="543" font-size="13.5" text-anchor="middle" fill="#A9701A">上线节奏</text>

    <!-- 叶子节点 -->
    <g fill="#1F2329" font-size="12.5">
      <rect x="720" y="190" width="140" height="40" rx="10" fill="#FFFFFF" stroke="#DFE3EA"/>
      <text x="790" y="215" text-anchor="middle">新手引导</text>
      <rect x="720" y="266" width="140" height="40" rx="10" fill="#FFFFFF" stroke="#DFE3EA"/>
      <text x="790" y="291" text-anchor="middle">性能优化</text>
      <rect x="756" y="330" width="140" height="40" rx="10" fill="#FFFFFF" stroke="#DFE3EA"/>
      <text x="826" y="355" text-anchor="middle">灰度方案</text>
      <rect x="756" y="410" width="140" height="40" rx="10" fill="#FFFFFF" stroke="#DFE3EA"/>
      <text x="826" y="435" text-anchor="middle">回滚预案</text>
      <rect x="720" y="490" width="140" height="40" rx="10" fill="#FFFFFF" stroke="#DFE3EA"/>
      <text x="790" y="515" text-anchor="middle">首周复盘</text>
      <rect x="720" y="566" width="140" height="40" rx="10" fill="#FFFFFF" stroke="#DFE3EA"/>
      <text x="790" y="591" text-anchor="middle">双周节奏</text>
    </g>

    <!-- 手写便签 -->
    <g transform="rotate(-3 215 624)" filter="url(#c2Note)">
      <rect x="140" y="580" width="150" height="88" rx="6" fill="#FFF1D9" stroke="#F0D9A8"/>
      <text x="158" y="606" font-size="12" font-weight="600" fill="#8A6512">待办</text>
      <text x="158" y="628" font-size="11.5" fill="#8A6512">· 补齐埋点</text>
      <text x="158" y="648" font-size="11.5" fill="#8A6512">· 灰度名单</text>
    </g>
  </g>

  <!-- 右侧面板 -->
  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
    <rect x="932" y="72" width="248" height="658" fill="#FAFBFC"/>
    <line x1="932.5" y1="72" x2="932.5" y2="730" stroke="#E9EBEF"/>
    <text x="956" y="104" font-size="13.5" font-weight="600" fill="#1F2329">主题</text>
    <text x="956" y="136" font-size="12" fill="#8A9099">配色</text>
    <rect x="1032" y="123" width="22" height="22" rx="6" fill="#2E6BE6"/>
    <rect x="1062" y="123" width="22" height="22" rx="6" fill="#12B5A5"/>
    <rect x="1092" y="123" width="22" height="22" rx="6" fill="#E8A33D"/>
    <rect x="1122" y="123" width="22" height="22" rx="6" fill="#8B5CF6"/>
    <text x="956" y="182" font-size="12" fill="#8A9099">布局</text>
    <g fill="#1F2329" font-size="12" text-anchor="middle">
      <rect x="1032" y="169" width="52" height="24" rx="8" fill="#E8F0FF" stroke="#2E6BE6"/>
      <text x="1058" y="185" fill="#1B3FA8">右向</text>
      <rect x="1092" y="169" width="52" height="24" rx="8" fill="#FFFFFF" stroke="#E1E3E8"/>
      <text x="1118" y="185">下向</text>
    </g>
    <line x1="956" y1="224" x2="1156" y2="224" stroke="#EFF1F4"/>
    <text x="956" y="256" font-size="13.5" font-weight="600" fill="#1F2329">本页</text>
    <text x="956" y="284" font-size="12" fill="#8A9099">元素 11 个 · 连线 9 条</text>
    <text x="956" y="308" font-size="12" fill="#8A9099">保存在 DSH 数据目录</text>
  </g>

  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
    <rect x="866" y="682" width="46" height="26" rx="13" fill="#FFFFFF" stroke="#E1E3E8"/>
    <text x="889" y="699" font-size="12" text-anchor="middle" fill="#1F2329">86%</text>
    <text x="108" y="700" font-size="12" fill="#8A9099">已保存 · 12:11:07</text>
  </g>
</svg>
